# Pipeline único, con etapas visibles en la UI de GitHub:
#
#   CI ─┬─ backend   (tests + build)       ─┐
#       ├─ frontend  (npm ci + build)       ├─> Build (imágenes + Trivy + E2E) ─> Release (GHCR) ─> Deploy (AWS)
#       └─ terraform (fmt + validate)       │        solo push a main / tag v*    solo si DEPLOY_ENABLED
#   Security ─ Trivy (deps, secretos, IaC) ─┘
#
# Cualquier job que falle detiene todo lo que depende de él: nada se publica ni despliega
# sin pasar los quality gates.
name: pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

# Mínimo privilegio: solo lectura por defecto; cada job pide lo que necesita
permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_VERSION: v0.74.0
  TERRAFORM_VERSION: 1.16.4

jobs:
  # ===========================================================================
  # CI
  # ===========================================================================
  backend:
    name: "CI · backend"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven            # caché de ~/.m2 por hash de pom.xml

      - name: Tests y empaquetado (mvn verify)
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Publicar reportes de tests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: "CI · frontend"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm              # caché del directorio de npm, no de node_modules
          cache-dependency-path: frontend/package-lock.json

      - name: Instalación reproducible (npm ci)
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build de producción (con budgets de tamaño)
        working-directory: frontend
        run: npm run build

  terraform:
    name: "CI · terraform"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Formato
        run: terraform fmt -check -recursive

      - name: Init sin backend remoto (no requiere credenciales)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Pruebas del plan con provider simulado (sin credenciales ni costo)
        run: terraform test

  # ===========================================================================
  # SECURITY
  # ===========================================================================
  security:
    name: "Security · Trivy (deps, secretos, IaC)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write    # subir resultados a la pestaña Security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Quality gate — HIGH/CRITICAL con parche
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          trivy-config: trivy.yaml
          version: ${{ env.TRIVY_VERSION }}

      - name: Reporte SARIF (informativo)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          trivy-config: trivy.yaml
          version: ${{ env.TRIVY_VERSION }}
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"

      - name: Subir SARIF a GitHub Code Scanning
        if: always()
        continue-on-error: true   # en repos privados sin GHAS no está disponible
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ===========================================================================
  # BUILD: imágenes, escaneo de imágenes y prueba E2E del stack
  # ===========================================================================
  build:
    name: "Build · imágenes + escaneo + E2E"
    needs: [backend, frontend, terraform, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          tags: local/parking-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          load: true
          tags: local/parking-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Trivy — imagen backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: local/parking-backend:ci
          trivy-config: trivy.yaml
          version: ${{ env.TRIVY_VERSION }}

      - name: Trivy — imagen frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: local/parking-frontend:ci
          trivy-config: trivy.yaml
          version: ${{ env.TRIVY_VERSION }}

      - name: Tamaño de imágenes
        run: docker image ls --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}' | grep parking

      - name: E2E con Docker Compose (health, seguridad, smoke test, correlación)
        env:
          IMAGE_REGISTRY: local
          IMAGE_TAG: ci
        run: |
          # Password efímero, generado en el runner y nunca impreso
          sed "s|CAMBIAR_POR_UN_PASSWORD_ALEATORIO|$(openssl rand -hex 24)|" .env.example > .env
          ./scripts/validate-stack.sh --no-build

  # ===========================================================================
  # RELEASE: publica imágenes inmutables en GitHub Container Registry
  # ===========================================================================
  release:
    name: "Release · GHCR (${{ matrix.service }})"
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write           # solo este job puede publicar imágenes
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Los nombres de imagen en GHCR deben ir en minúsculas
      - name: Nombre de imagen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/parking-${{ matrix.service }}" >> "$GITHUB_ENV"

      # Versionado: sha-<commit> siempre (inmutable, el que se despliega);
      # X.Y.Z y X.Y cuando se publica un tag vX.Y.Z; "main" apunta al último build de main.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - name: Build y push (reutiliza la caché del job build)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          provenance: mode=max    # atestación de origen (SLSA)
          sbom: true              # inventario de componentes adjunto a la imagen

  # ===========================================================================
  # DEPLOY: Terraform aplica la nueva versión en AWS
  #   main    -> ambiente "dev"         (automático)
  #   tag v*  -> ambiente "production"  (requiere aprobación en el Environment)
  # Se activa solo si la variable de repositorio DEPLOY_ENABLED = 'true'.
  # ===========================================================================
  deploy:
    name: "Deploy · ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'dev' }}"
    needs: release
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'dev' }}
      url: ${{ steps.apply.outputs.app_url }}
    concurrency:
      group: deploy-${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'dev' }}
      cancel-in-progress: false   # nunca interrumpir un despliegue a medias
    permissions:
      contents: read
      id-token: write           # OIDC: credenciales AWS temporales, sin llaves guardadas
    env:
      TF_ENV: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'dev' }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Init (state remoto en S3, uno por ambiente)
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=parking/${TF_ENV}/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Plan (despliega exactamente la imagen sha-<commit> que pasó los quality gates)
        run: >-
          terraform plan -input=false -out=tfplan
          -var-file="environments/${TF_ENV}.tfvars"
          -var="image_tag=sha-${GITHUB_SHA::7}"
          -var="image_repository=ghcr.io/${GITHUB_REPOSITORY,,}"

      - name: Apply (espera a que ECS quede estable; rollback automático si falla)
        id: apply
        run: |
          terraform apply -input=false tfplan
          echo "app_url=$(terraform output -raw app_url)" >> "$GITHUB_OUTPUT"

      - name: Smoke test contra el ambiente desplegado
        working-directory: .
        env:
          BASE_URL: ${{ steps.apply.outputs.app_url }}
        run: ./scripts/smoke-test.sh
