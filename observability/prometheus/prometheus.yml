# Prometheus mínimo: un solo target (backend) y reglas de alerta.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: parking-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]    # puerto de gestión, solo en la red interna
