# Perfil para contenedores (Docker Compose / AWS ECS).
# Sin valores por defecto para credenciales: si faltan, la aplicación NO arranca (fail fast).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
